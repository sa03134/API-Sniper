<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Sniper</title>
    <style>
      :root {
        --bg-primary: #1e1e2e;
        --bg-secondary: #181825;
        --bg-surface: #252537;
        --bg-hover: #2e2e42;
        --text-primary: #cdd6f4;
        --text-secondary: #a6adc8;
        --text-muted: #6c7086;
        --accent: #89b4fa;
        --accent-hover: #74c7ec;
        --green: #a6e3a1;
        --red: #f38ba8;
        --yellow: #f9e2af;
        --peach: #fab387;
        --border: #313244;
        --scrollbar-thumb: #45475a;
        --scrollbar-track: #1e1e2e;
        --method-get: #a6e3a1;
        --method-post: #89b4fa;
        --method-put: #f9e2af;
        --method-delete: #f38ba8;
        --method-patch: #fab387;
        --radius: 8px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #eff1f5;
          --bg-secondary: #e6e9ef;
          --bg-surface: #dce0e8;
          --bg-hover: #ccd0da;
          --text-primary: #4c4f69;
          --text-secondary: #5c5f77;
          --text-muted: #8c8fa1;
          --accent: #1e66f5;
          --accent-hover: #209fb5;
          --green: #40a02b;
          --red: #d20f39;
          --yellow: #df8e1d;
          --peach: #fe640b;
          --border: #bcc0cc;
          --scrollbar-thumb: #9ca0b0;
          --scrollbar-track: #eff1f5;
          --method-get: #40a02b;
          --method-post: #1e66f5;
          --method-put: #df8e1d;
          --method-delete: #d20f39;
          --method-patch: #fe640b;
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 13px;
        line-height: 1.5;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* ── Toolbar ── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .toolbar-title {
        font-weight: 700;
        font-size: 14px;
        color: var(--accent);
        letter-spacing: 0.5px;
        user-select: none;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 22px;
        padding: 0 7px;
        border-radius: 11px;
        background: var(--accent);
        color: var(--bg-primary);
        font-size: 11px;
        font-weight: 700;
      }

      .badge-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .badge-label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        font-weight: 600;
      }
      .badge-clean {
        background: var(--green);
      }

      .toolbar-spacer {
        flex: 1;
      }

      .filter-input {
        padding: 5px 10px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 12px;
        width: 200px;
        outline: none;
        transition: border-color 0.15s;
      }
      .filter-input:focus {
        border-color: var(--accent);
      }
      .filter-input::placeholder {
        color: var(--text-muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        user-select: none;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--bg-hover);
        border-color: var(--accent);
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn-accent {
        background: var(--accent);
        color: var(--bg-primary);
        border-color: var(--accent);
      }
      .btn-accent:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn-danger {
        color: var(--red);
        border-color: var(--red);
      }
      .btn-danger:hover {
        background: var(--red);
        color: var(--bg-primary);
      }

      /* ── Toast notification ── */
      .toast {
        position: fixed;
        top: 16px;
        right: 16px;
        padding: 10px 20px;
        border-radius: var(--radius);
        background: var(--green);
        color: var(--bg-primary);
        font-size: 12px;
        font-weight: 700;
        box-shadow: var(--shadow);
        transform: translateY(-60px);
        opacity: 0;
        transition: transform 0.3s ease, opacity 0.3s ease;
        z-index: 1000;
        pointer-events: none;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      /* ── Request list ── */
      .request-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        gap: 8px;
        user-select: none;
      }
      .empty-state-icon {
        font-size: 40px;
        opacity: 0.4;
      }
      .empty-state-text {
        font-size: 13px;
      }

      .request-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 6px;
        overflow: hidden;
        transition: border-color 0.15s;
      }
      .request-card:hover {
        border-color: var(--accent);
      }
      .request-card.noise {
        opacity: 0.4;
        border-left: 3px solid var(--text-muted);
      }
      .request-card.noise:hover {
        opacity: 0.7;
      }

      .noise-tag {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--text-muted);
        color: var(--bg-primary);
        flex-shrink: 0;
      }

      .request-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        cursor: pointer;
        user-select: none;
      }

      .method-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
        font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
        text-transform: uppercase;
        min-width: 56px;
        text-align: center;
      }
      .method-GET    { background: var(--method-get);    color: var(--bg-primary); }
      .method-POST   { background: var(--method-post);   color: var(--bg-primary); }
      .method-PUT    { background: var(--method-put);    color: var(--bg-primary); }
      .method-DELETE  { background: var(--method-delete); color: var(--bg-primary); }
      .method-PATCH  { background: var(--method-patch);  color: var(--bg-primary); }
      .method-OTHER  { background: var(--text-muted);    color: var(--bg-primary); }

      .request-url {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .request-status {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .status-ok {
        color: var(--green);
      }
      .status-err {
        color: var(--red);
      }
      .status-pending {
        color: var(--yellow);
      }

      .expand-arrow {
        color: var(--text-muted);
        font-size: 10px;
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .request-card.expanded .expand-arrow {
        transform: rotate(90deg);
      }

      .request-detail {
        display: none;
        padding: 0 12px 12px;
      }
      .request-card.expanded .request-detail {
        display: block;
      }

      .detail-section {
        margin-top: 8px;
      }
      .detail-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .detail-pre {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
        font-size: 11px;
        color: var(--text-primary);
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 300px;
        overflow-y: auto;
        line-height: 1.6;
      }

      /* ── Settings drawer ── */
      .settings-drawer {
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.25s ease, padding 0.25s ease;
      }
      .settings-drawer.open {
        max-height: 500px;
        padding: 14px 16px;
      }

      .drawer-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .drawer-subtitle {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        margin-bottom: 4px;
      }
      .drawer-hint {
        font-size: 10px;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .drawer-separator {
        height: 1px;
        background: var(--border);
        margin: 12px 0;
      }

      .toggle-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        cursor: pointer;
        font-size: 12px;
        color: var(--text-primary);
      }
      .toggle-row input[type="checkbox"] {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        cursor: pointer;
      }
      .toggle-hint {
        width: 100%;
        font-size: 10px;
        color: var(--text-muted);
        padding-left: 23px;
        margin-top: -4px;
      }

      .keyword-input-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .keyword-input {
        flex: 1;
        width: auto;
      }
      .keyword-add-btn {
        padding: 5px 12px;
      }
      .keyword-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .keyword-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 4px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        font-size: 11px;
        font-family: "SF Mono", "Cascadia Code", monospace;
        color: var(--text-secondary);
      }
      .keyword-remove {
        cursor: pointer;
        color: var(--red);
        font-size: 14px;
        line-height: 1;
        font-weight: 700;
        margin-left: 2px;
      }
      .keyword-remove:hover {
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <!-- Toast -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <!-- Toolbar -->
    <div class="toolbar">
      <span class="toolbar-title">API Sniper</span>
      <span class="badge-group">
        <span id="requestCount" class="badge">0</span>
        <span class="badge-label">total</span>
      </span>
      <span class="badge-group">
        <span id="cleanCount" class="badge badge-clean">0</span>
        <span class="badge-label">clean</span>
      </span>
      <div class="toolbar-spacer"></div>
      <input
        id="filterInput"
        class="filter-input"
        type="text"
        placeholder="Filter by URL..."
      />
      <button id="btnCopyClean" class="btn btn-accent">Copy Clean Data</button>
      <button id="btnCopy" class="btn">Copy All</button>
      <button id="btnClear" class="btn btn-danger">Clear</button>
      <button id="btnSettings" class="btn" title="Filter settings">&#x2699;</button>
    </div>

    <!-- Settings drawer -->
    <div id="settingsDrawer" class="settings-drawer">
      <div class="drawer-title">Noise Filter Settings</div>

      <label class="toggle-row">
        <input type="checkbox" id="chkSameOrigin" checked />
        <span>Same-origin only</span>
        <span class="toggle-hint">Hide 3rd-party domains (analytics, SDKs)</span>
      </label>

      <label class="toggle-row">
        <input type="checkbox" id="chkHideEmpty" checked />
        <span>Hide empty responses</span>
        <span class="toggle-hint">Skip {}, [], null, true, "" bodies</span>
      </label>

      <label class="toggle-row">
        <input type="checkbox" id="chkJsonOnly" />
        <span>JSON responses only</span>
        <span class="toggle-hint">Keep only Content-Type: application/json</span>
      </label>

      <div class="drawer-separator"></div>
      <div class="drawer-subtitle">Custom block keywords</div>
      <div class="drawer-hint">URLs containing these keywords will be marked as noise.</div>
      <div class="keyword-input-row">
        <input id="customKeywordsInput" class="filter-input keyword-input" type="text" placeholder="e.g. /api/logs" />
        <button id="btnAddKeyword" class="btn btn-accent keyword-add-btn">Add</button>
      </div>
      <div id="customKeywordsList" class="keyword-list"></div>
    </div>

    <!-- Request list -->
    <div id="requestList" class="request-list">
      <div id="emptyState" class="empty-state">
        <div class="empty-state-icon">&#x1f50d;</div>
        <div class="empty-state-text">No requests captured yet. Navigate or refresh the inspected page.</div>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
